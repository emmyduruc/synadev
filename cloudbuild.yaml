# Build & push @syna/backend image in Google Cloud (reliable npm/registry network).
# Used by scripts/deploy-backend-cloud-run.sh — prefer this over local Docker builds
# when Docker Desktop cannot reach the npm registry (TLS timeouts).
#
# Substitutions (optional):
#   _REGION   default europe-west1
#   _REPO     Artifact Registry repo name
#   _SERVICE  image / Cloud Run service name
#   _TAG      image tag (usually git sha)

substitutions:
  _REGION: europe-west1
  _REPO: syna
  _SERVICE: syna-backend
  _TAG: latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1800s

steps:
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - --platform=linux/amd64
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${_TAG}
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - --file=Dockerfile
      - .

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
